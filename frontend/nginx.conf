server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS interno de Docker. Con proxy_pass a un nombre fijo, nginx resuelve la IP una sola vez
    # al arrancar; si el backend se recrea (p. ej. en un despliegue) cambia de IP y nginx
    # respondería 502. Usando una variable, nginx vuelve a resolver "backend" cada 10 s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Proxy de la API hacia el contenedor del backend
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Propaga el contexto de traza W3C si el navegador lo envía
        proxy_set_header traceparent $http_traceparent;
        proxy_read_timeout 30s;
    }

    # Archivos estáticos con hash: caché larga
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html (Angular Router)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
