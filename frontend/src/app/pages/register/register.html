<section class="card auth-card">
  <h1>Crear cuenta</h1>

  @if (error()) {
    <div class="alert alert-error" data-testid="register-error" role="alert">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate data-testid="register-form">
    <div class="form-field">
      <label for="name">Nombre</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        autocomplete="name"
        data-testid="register-name"
        [class.invalid]="invalid('name')"
      />
      @if (invalid('name')) {
        <span class="field-error">El nombre debe tener al menos 2 caracteres</span>
      }
    </div>

    <div class="form-field">
      <label for="email">Correo</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        data-testid="register-email"
        [class.invalid]="invalid('email')"
      />
      @if (invalid('email')) {
        <span class="field-error">Ingresa un correo válido</span>
      }
    </div>

    <div class="form-field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        data-testid="register-password"
        [class.invalid]="invalid('password')"
      />
      @if (invalid('password')) {
        <span class="field-error">Mínimo 6 caracteres</span>
      }
    </div>

    <button type="submit" class="btn btn-block" data-testid="register-submit" [disabled]="loading()">
      {{ loading() ? 'Registrando...' : 'Registrarme' }}
    </button>
  </form>

  <p class="muted">
    ¿Ya tienes cuenta? <a routerLink="/login" data-testid="go-to-login">Inicia sesión</a>
  </p>
</section>
